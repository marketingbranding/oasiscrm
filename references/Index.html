<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OASYNC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.css" rel="stylesheet">
  <style>
    :root { --sidebar-width: 260px; --header-height: 56px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; background: #f5f6fa; }
    .app-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: #1a1a2e; color: #fff; display: flex; align-items: center; padding: 0 1rem; z-index: 1040; gap: 0.75rem; }
    .app-header .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px; }
    .app-header .brand small { font-weight: 400; opacity: 0.7; font-size: 0.8rem; }
    .sidebar-toggle { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 0 0.25rem; }
    .sidebar { position: fixed; top: var(--header-height); left: 0; bottom: 0; width: var(--sidebar-width); background: #fff; border-right: 1px solid #e0e0e0; overflow-y: auto; z-index: 1030; transition: transform 0.25s ease; }
    .sidebar .search-box { padding: 0.75rem; border-bottom: 1px solid #eee; }
    .sidebar .search-box input { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 0.45rem 0.65rem; font-size: 0.8rem; outline: none; }
    .sidebar .search-box input:focus { border-color: #4361ee; }
    .sidebar .sheet-list { list-style: none; padding: 0.25rem 0; margin: 0; }
    .sidebar .sheet-item { padding: 0.5rem 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; border-left: 3px solid transparent; font-size: 0.82rem; transition: all 0.15s; }
    .sidebar .sheet-item:hover { background: #f0f2ff; }
    .sidebar .sheet-item.active { background: #eef0ff; border-left-color: #4361ee; font-weight: 600; color: #4361ee; }
    .sidebar .sheet-item .icon { width: 18px; text-align: center; font-size: 0.75rem; opacity: 0.6; }
    .sidebar .sheet-pivot { border-top: 1px solid #eee; margin-top: 0.25rem; padding-top: 0.25rem; }
    .sidebar .sheet-pivot .sheet-item { color: #e67e22; }
    .sidebar .sheet-pivot .sheet-item.active { color: #e67e22; border-left-color: #e67e22; }
    .main-content { margin-left: var(--sidebar-width); padding-top: calc(var(--header-height) + 1rem); padding-left: 1.5rem; padding-right: 1.5rem; min-height: 100vh; transition: margin-left 0.25s ease; }
    .content-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 1.25rem; }
    .content-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .content-header h5 { margin: 0; font-weight: 600; font-size: 1.05rem; }
    .table-wrap { overflow-x: auto; }
    .table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .table-wrap th { background: #f8f9fc; position: sticky; top: 0; white-space: nowrap; padding: 0.55rem 0.6rem; border-bottom: 2px solid #e0e0e0; text-align: left; font-weight: 600; color: #444; }
    .table-wrap td { padding: 0.45rem 0.6rem; border-bottom: 1px solid #f0f0f0; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .table-wrap tr:hover td { background: #fafbff; }
    .table-wrap tr.selected td { background: #eef0ff; }
    .table-wrap .row-num { color: #999; font-size: 0.75rem; width: 36px; text-align: center; }
    .table-wrap .actions-cell { width: 100px; text-align: center; white-space: nowrap; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #999; }
    .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; z-index: 1050; }
    .toast-container { position: fixed; top: calc(var(--header-height) + 0.5rem); right: 1rem; z-index: 1060; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast-msg { background: #333; color: #fff; padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.85rem; box-shadow: 0 3px 12px rgba(0,0,0,0.15); animation: slideIn 0.3s ease; max-width: 360px; }
    .toast-msg.success { background: #2d6a4f; }
    .toast-msg.error { background: #d32f2f; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .modal-form .form-label { font-size: 0.8rem; font-weight: 500; margin-bottom: 0.2rem; }
    .modal-form .form-control, .modal-form .form-select { font-size: 0.85rem; padding: 0.4rem 0.6rem; }
    .modal-form .mb-2 { margin-bottom: 0.5rem; }
    .modal-header { padding: 0.85rem 1rem; }
    .modal-body { padding: 0.85rem 1rem; max-height: 60vh; overflow-y: auto; }
    .modal-footer { padding: 0.65rem 1rem; }
    .badge-sheet { font-size: 0.7rem; font-weight: 500; padding: 0.2rem 0.5rem; border-radius: 4px; background: #e8eaff; color: #4361ee; }
    .filter-bar { background: #f8f9fc; border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.75rem; display: none; margin-bottom: 0.75rem; max-height: 250px; overflow-y: auto; }
    .filter-bar.show { display: block; }
    .filter-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-item { flex: 1 1 170px; min-width: 140px; }
    .filter-item label { font-size: 0.7rem; font-weight: 500; color: #666; margin-bottom: 0.1rem; display: block; }
    .filter-item input, .filter-item select { font-size: 0.78rem; padding: 0.2rem 0.35rem; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem; font-size: 0.8rem; padding: 0.4rem 0.2rem; }
    .nama-konsumen-col.hidden { display: none; }
    th.nama-konsumen-col { background: #fff3e0 !important; color: #e67e22; }
    td.nama-konsumen-col { background: #fffaf0; }
    .page-size-select { width: auto; font-size: 0.78rem; padding: 0.2rem 0.4rem; border: 1px solid #ddd; border-radius: 4px; }
    .pivot-wrapper { min-height: 400px; }
    .pivot-wrapper .pvtUi { width: 100% !important; }
    .row-count { font-size: 0.8rem; color: #888; }
    .sidebar.collapsed { transform: translateX(-100%); }
    .main-content.expanded { margin-left: 0; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.show { transform: translateX(0); }
      .main-content { margin-left: 0; padding-left: 0.75rem; padding-right: 0.75rem; }
    }
  </style>
</head>
<body>

<div class="app-header">
  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">&#9776;</button>
  <div class="brand">OASYNC <small id="cabangName"></small></div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="badge-sheet" id="activeSheetBadge">Pilih sheet</span>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="search-box">
    <input type="text" id="sheetSearch" placeholder="Cari sheet..." autocomplete="off">
  </div>
  <ul class="sheet-list" id="sheetList"></ul>
  <ul class="sheet-list sheet-pivot" id="pivotList">
    <li class="sheet-item" data-view="pivot" id="pivotNav">
      <span class="icon"><i class="bi bi-bar-chart-fill"></i></span> Pivot Table
    </li>
  </ul>
</div>

<div class="main-content" id="mainContent">
  <div class="content-card">
    <div class="content-header">
      <div>
        <h5 id="viewTitle">Pilih sheet dari sidebar</h5>
        <span class="row-count" id="rowCount"></span>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <button class="btn btn-sm btn-outline-info" id="filterToggleBtn" title="Filter" style="display:none">
          <i class="bi bi-funnel"></i>
        </button>
        <button class="btn btn-sm btn-outline-warning" id="namaKonsumenToggleBtn" title="Tampilkan/Sembunyikan Nama Konsumen" style="display:none">
          <i class="bi bi-person"></i>
        </button>
        <select class="page-size-select" id="pageSizeSelect" style="display:none">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20" selected>20</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="0">Semua</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn" title="Refresh data">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-sm btn-primary" id="addBtn" style="display:none">
          <i class="bi bi-plus-lg"></i> Tambah
        </button>
      </div>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div id="viewContainer"></div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
    <div class="mt-2 text-muted" id="loadingText">Memuat data...</div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal fade" id="crudModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="crudModalTitle">Form</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="crudForm" class="modal-form"></form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-sm btn-primary" id="crudSubmitBtn">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 2rem;"></i>
        <p class="mt-2 mb-0" id="confirmText">Yakin ingin menghapus?</p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-sm btn-danger" id="confirmDeleteBtn">Hapus</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>
<script>
  var sheetId = '<?= sheetId ?>';
  var cabangName = '<?= cabangName ?>';
  document.getElementById('cabangName').textContent = '- ' + cabangName;

  var allSheets = [];
  var currentSheet = null;
  var currentData = null;
  var editingIndex = -1;
  var activeView = 'list';
  var modalInstance = null;
  var isPivotRendering = false;
  var pageSize = 20;
  var currentPage = 1;
  var filterValues = {};
  var showFilter = false;
  var allFilteredIndices = null;
  var FILTER_COLUMNS = ['id_kavling'];
  var showNamaKonsumen = false;
  var namaKonsumenMap = {};
  var PIPELINE_SHEETS = ['bi_checking', 'PSJB', 'pemberkasan', 'proses_bank', 'ppjb_dev', 'akad', 'bast'];
  var REFERENCE_SHEETS = ['data_sales', 'data_bank', 'data_kav', 'promo'];
  var refData = {};

  function showLoading(text) {
    document.getElementById('loadingText').textContent = text || 'Memuat data...';
    document.getElementById('loadingOverlay').style.display = 'flex';
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
  }

  function toast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast-msg ' + (type || '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
  }

  function escHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Sheet Loading ───────────────────────────────

  function loadSheets() {
    showLoading('Memuat daftar sheet...');
    google.script.run
      .withSuccessHandler(function(names) {
        allSheets = names;
        renderSheetList(names);
        hideLoading();
        if (names.length > 0) selectSheet(names[0]);
        initNamaKonsumen();
        loadRefData();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        toast('Gagal memuat sheet: ' + err, 'error');
      })
      .getSheetNames(sheetId);
  }

  function renderSheetList(names) {
    var list = document.getElementById('sheetList');
    list.innerHTML = '';
    names.forEach(function(name) {
      var li = document.createElement('li');
      li.className = 'sheet-item';
      li.dataset.sheet = name;
      li.innerHTML = '<span class="icon"><i class="bi bi-table"></i></span> ' + escHtml(name);
      li.onclick = function() { selectSheet(name); };
      list.appendChild(li);
    });
  }

  function selectSheet(name) {
    currentSheet = name;
    activeView = 'list';
    currentPage = 1;
    filterValues = {};
    showFilter = false;
    var bar = document.getElementById('filterBar');
    bar.classList.remove('show');
    document.getElementById('filterToggleBtn').classList.remove('active');
    document.querySelectorAll('.sheet-item').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.sheet-item[data-sheet="' + name.replace(/"/g,'\\"') + '"]').forEach(function(el) { el.classList.add('active'); });
    document.querySelectorAll('.sheet-item[data-view="pivot"]').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('activeSheetBadge').textContent = name;
    loadSheetData(name);
  }

  function loadSheetData(name) {
    showLoading('Memuat data ' + name + '...');
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result.error) { toast(result.error, 'error'); return; }
        currentData = result;
        if (activeView === 'list') renderTable();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        toast('Gagal memuat data: ' + err, 'error');
      })
      .getSheetData(name, sheetId);
  }

  function initNamaKonsumen() {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.error || !result.rows) return;
        namaKonsumenMap = {};
        result.rows.forEach(function(r) {
          var kav = r.id_kavling ? String(r.id_kavling).trim() : '';
          var nama = r.nama_konsumen ? String(r.nama_konsumen).trim() : '';
          if (kav && nama) namaKonsumenMap[kav] = nama;
        });
      })
      .withFailureHandler(function() {})
      .getSheetData('data_konsumen', sheetId);
  }

  function loadRefData() {
    var pending = REFERENCE_SHEETS.slice();
    function loadNext() {
      if (pending.length === 0) return;
      var name = pending.shift();
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.error) refData[name] = result;
          loadNext();
        })
        .withFailureHandler(function() { loadNext(); })
        .getSheetData(name, sheetId);
    }
    loadNext();
  }

  function getPageRows() {
    var filtered = getFilteredRows();
    allFilteredIndices = filtered.indices;
    var total = filtered.rows.length;
    var size = pageSize === 0 ? total : pageSize;
    var totalPages = size === 0 ? 1 : Math.max(1, Math.ceil(total / size));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    var start = (currentPage - 1) * size;
    var end = Math.min(start + size, total);
    return {
      rows: filtered.rows.slice(start, end),
      indices: filtered.indices.slice(start, end),
      total: total,
      start: start + 1,
      end: end,
      totalPages: totalPages,
      page: currentPage,
    };
  }

  function buildFilterBar() {
    var bar = document.getElementById('filterBar');
    if (!currentData || !currentData.headers) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
    var hasIdKavling = currentData.headers.some(function(h) { return h.toLowerCase() === 'id_kavling'; });
    if (!hasIdKavling) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
    var html = '<div class="filter-grid">';
    html += '<div class="filter-item"><label>ID Kavling</label>'
      + '<input type="text" class="filter-input" data-col="id_kavling" data-field="text" placeholder="Cari..." value="' + escHtml((filterValues['id_kavling'] && filterValues['id_kavling'].text) || '') + '"></div>';
    html += '<div class="filter-item"><label>Nama Konsumen</label>'
      + '<input type="text" class="filter-input" data-col="nama_konsumen" data-field="text" placeholder="Cari..." value="' + escHtml((filterValues['nama_konsumen'] && filterValues['nama_konsumen'].text) || '') + '"></div>';
    html += '</div>';
    bar.innerHTML = html;
    bar.querySelectorAll('.filter-input').forEach(function(inp) {
      inp.addEventListener('input', function() {
        var col = this.dataset.col;
        var field = this.dataset.field;
        var val = this.value;
        if (!filterValues[col]) filterValues[col] = {};
        filterValues[col][field] = val;
        var hasVal = false;
        for (var k in filterValues[col]) { if (filterValues[col][k]) { hasVal = true; break; } }
        if (!hasVal) delete filterValues[col];
        currentPage = 1;
        renderTable();
      });
    });
  }

  function getFilteredRows() {
    if (!currentData || !currentData.rows) return { rows: [], indices: [] };
    var rows = currentData.rows;
    var hasFilter = false;
    for (var k in filterValues) { if (filterValues.hasOwnProperty(k)) { hasFilter = true; break; } }
    if (!hasFilter) {
      var allIdx = [];
      for (var i = 0; i < rows.length; i++) allIdx.push(i);
      return { rows: rows, indices: allIdx };
    }
    var result = [];
    var indices = [];
    rows.forEach(function(r, idx) {
      var match = true;
      for (var col in filterValues) {
        if (!filterValues.hasOwnProperty(col)) continue;
        var f = filterValues[col];
        var val;
        if (col === 'nama_konsumen') {
          var kav = (r.id_kavling !== undefined && r.id_kavling !== null) ? String(r.id_kavling).trim() : '';
          val = namaKonsumenMap[kav] || '';
        } else {
          val = (r[col] !== undefined && r[col] !== null) ? String(r[col]) : '';
        }
        if (f.text && f.text !== '') {
          if (val.toLowerCase().indexOf(f.text.toLowerCase()) === -1) { match = false; break; }
        }
        if (f.from && f.from !== '') {
          if (val < f.from) { match = false; break; }
        }
        if (f.to && f.to !== '') {
          if (val > f.to) { match = false; break; }
        }
        if ((f.min !== undefined && f.min !== '') || (f.max !== undefined && f.max !== '')) {
          var numVal = parseFloat(val) || 0;
          if (f.min !== '' && numVal < parseFloat(f.min)) { match = false; break; }
          if (f.max !== '' && numVal > parseFloat(f.max)) { match = false; break; }
        }
      }
      if (match) { result.push(r); indices.push(idx); }
    });
    return { rows: result, indices: indices };
  }

  function loadCurrentSheet() {
    if (currentSheet && activeView === 'list') loadSheetData(currentSheet);
    else if (activeView === 'pivot') renderPivot();
  }

  // ─── Table View ──────────────────────────────────

  function renderTable() {
    var c = document.getElementById('viewContainer');
    document.getElementById('addBtn').style.display = 'inline-flex';
    document.getElementById('filterToggleBtn').style.display = 'inline-flex';
    document.getElementById('pageSizeSelect').style.display = 'inline-block';
    document.getElementById('viewTitle').textContent = currentSheet || 'Data';

    if (!currentData || !currentData.rows || currentData.rows.length === 0) {
      document.getElementById('rowCount').textContent = currentData && currentData.rows ? currentData.rows.length + ' baris' : '';
      c.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i>Tidak ada data</div>';
      return;
    }

    var pageInfo = getPageRows();
    var total = pageInfo.total;
    document.getElementById('rowCount').textContent = total + ' baris' + (total !== currentData.rows.length ? ' (difilter dari ' + currentData.rows.length + ')' : '');

    if (pageInfo.rows.length === 0) {
      c.innerHTML = '<div class="empty-state"><i class="bi bi-search"></i>Tidak ada data sesuai filter</div>';
      return;
    }

    var hasIdKavling = currentData.headers.some(function(h) { return h.toLowerCase() === 'id_kavling'; });
    var showNamaCol = hasIdKavling;
    if (showNamaCol) {
      document.getElementById('namaKonsumenToggleBtn').style.display = 'inline-flex';
      if (showNamaKonsumen) document.getElementById('namaKonsumenToggleBtn').classList.add('active');
      else document.getElementById('namaKonsumenToggleBtn').classList.remove('active');
    }

    var ncClass = 'nama-konsumen-col' + (showNamaKonsumen ? '' : ' hidden');

    var html = '<div class="table-wrap"><table><thead><tr><th class="row-num">#</th>';
    currentData.headers.forEach(function(h) {
      html += '<th>' + escHtml(h) + '</th>';
      if (showNamaCol && h.toLowerCase() === 'id_kavling') html += '<th class="' + ncClass + '">Nama Konsumen</th>';
    });
    html += '<th class="actions-cell">Aksi</th></tr></thead><tbody>';

    pageInfo.rows.forEach(function(row, i) {
      var realIdx = pageInfo.indices[i];
      var rowNum = pageInfo.start + i;
      html += '<tr><td class="row-num">' + rowNum + '</td>';
      currentData.headers.forEach(function(h) {
        var val = row[h] !== undefined ? row[h] : '';
        html += '<td title="' + escHtml(val) + '">' + escHtml(val) + '</td>';
        if (showNamaCol && h.toLowerCase() === 'id_kavling') {
          var kav = (row.id_kavling !== undefined && row.id_kavling !== null) ? String(row.id_kavling).trim() : '';
          var nama = namaKonsumenMap[kav] || '';
          html += '<td class="' + ncClass + '" title="' + escHtml(nama) + '">' + escHtml(nama) + '</td>';
        }
      });
      html += '<td class="actions-cell">'
        + '<button class="btn btn-sm btn-outline-primary py-0 px-1 me-1 edit-row" data-idx="' + realIdx + '" title="Edit"><i class="bi bi-pencil"></i></button>'
        + '<button class="btn btn-sm btn-outline-danger py-0 px-1 delete-row" data-idx="' + realIdx + '" title="Hapus"><i class="bi bi-trash"></i></button>'
        + '</td></tr>';
    });

    html += '</tbody></table></div>';

    html += '<div class="pagination-bar">'
      + '<span>' + pageInfo.start + '-' + pageInfo.end + ' dari ' + total + ' &nbsp;|&nbsp; Hal ' + pageInfo.page + '/' + pageInfo.totalPages + '</span>'
      + '<div>'
      + '<button class="btn btn-sm btn-outline-secondary me-1" id="prevPageBtn"><i class="bi bi-chevron-left"></i> Prev</button>'
      + '<button class="btn btn-sm btn-outline-secondary" id="nextPageBtn">Next <i class="bi bi-chevron-right"></i></button>'
      + '</div></div>';

    c.innerHTML = html;
  }

  // ─── Add / Edit Modal ────────────────────────────

  function buildForm(data) {
    var form = document.getElementById('crudForm');
    form.innerHTML = '';
    var isPipeline = PIPELINE_SHEETS.indexOf(currentSheet) !== -1;
    currentData.headers.forEach(function(h, idx) {
      if (h.toLowerCase() === 'nama_konsumen') return;
      if (isPipeline && (idx === 1 || idx === 2)) return;
      var val = data[h] !== undefined ? data[h] : '';

      var refOptions = null;
      for (var rn in refData) {
        if (!refData.hasOwnProperty(rn)) continue;
        var rd = refData[rn];
        if (!rd || !rd.rows || !rd.headers) continue;
        if (rd.headers.indexOf(h) === -1) continue;
        var seen = {};
        var opts = [];
        rd.rows.forEach(function(r) {
          var v = (r[h] !== undefined && r[h] !== null) ? String(r[h]).trim() : '';
          if (v && !seen[v]) { seen[v] = true; opts.push(v); }
        });
        opts.sort();
        if (opts.length > 0) { refOptions = opts; break; }
      }
      if (refOptions && h.toLowerCase() === 'keterangan') refOptions = null;

      var col = h.toLowerCase();
      var inputType = 'text';

      if (col.indexOf('tanggal') !== -1 || col.indexOf('tgl') !== -1 || col.indexOf('date') !== -1) {
        inputType = 'date';
      } else if ((col.indexOf('harga') !== -1 || col.indexOf('plafond') !== -1 || col.indexOf('nominal') !== -1 || col.indexOf('jumlah') !== -1 || col.indexOf('dp') !== -1 || col.indexOf('utj') !== -1 || col.indexOf('klt') !== -1 || col.indexOf('biaya') !== -1) && !isNaN(parseFloat(String(val).replace(/[^0-9]/g, '')))) {
        inputType = 'number';
      } else if (col.indexOf('umur') !== -1 || col.indexOf('tenor') !== -1 || col.indexOf('lead_time') !== -1 || col.indexOf('skor') !== -1) {
        inputType = 'number';
      }

      var div = document.createElement('div');
      div.className = 'mb-2';
      var label = document.createElement('label');
      label.className = 'form-label';
      label.textContent = h;

      if (refOptions && refOptions.length > 0 && inputType !== 'date' && inputType !== 'number') {
        var select = document.createElement('select');
        select.className = 'form-select';
        select.name = h;
        var opt0 = document.createElement('option');
        opt0.value = '';
        opt0.textContent = '-- Pilih ' + h + ' --';
        select.appendChild(opt0);
        refOptions.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          if (o === val) opt.selected = true;
          select.appendChild(opt);
        });
        div.appendChild(label);
        div.appendChild(select);
      } else {
        var input = document.createElement('input');
        input.type = inputType;
        input.className = 'form-control';
        input.name = h;
        input.value = inputType === 'date' ? val : escHtml(val);
        div.appendChild(label);
        div.appendChild(input);
      }
      form.appendChild(div);
    });
  }

  // ─── Delete ──────────────────────────────────────

  var deleteTargetIdx = -1;

  function doDelete(idx) {
    var modal = bootstrap.Modal.getInstance(document.getElementById('confirmModal'));
    if (modal) modal.hide();
    showLoading('Menghapus data...');
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result.success) {
          toast('Data berhasil dihapus', 'success');
          loadSheetData(currentSheet);
        } else {
          toast('Gagal: ' + result.error, 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        toast('Error: ' + err, 'error');
      })
      .deleteRow(currentSheet, sheetId, idx);
  }

  // ─── Pivot View ──────────────────────────────────

  function renderPivot() {
    var c = document.getElementById('viewContainer');
    document.getElementById('viewTitle').textContent = 'Pivot Table';

    if (!currentData || !currentData.rows || currentData.rows.length === 0) {
      if (!currentSheet) {
        c.innerHTML = '<div class="empty-state"><i class="bi bi-bar-chart"></i>Pilih sheet data terlebih dahulu dari sidebar, lalu klik Pivot Table</div>';
        return;
      }
      c.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i>Data sheet "' + currentSheet + '" kosong</div>';
      return;
    }

    if (isPivotRendering) return;

    c.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted">Memproses pivot...</div></div>';

    setTimeout(function() {
      try {
        if (typeof $ === 'undefined' || !$.pivotUI) {
          c.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>PivotTable.js belum dimuat. Refresh halaman.</div>';
          return;
        }

        var data = currentData.rows;
        if (data.length === 0) {
          c.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i>Tidak ada data</div>';
          return;
        }

        var first = data[0];
        var numericCols = [];
        var allCols = Object.keys(first);

        allCols.forEach(function(k) {
          if (typeof first[k] === 'number' || (!isNaN(parseFloat(first[k])) && first[k] !== null && first[k] !== '' && first[k] !== 'KOSONG')) {
            numericCols.push(k);
          }
        });

        c.innerHTML = '<div class="pivot-wrapper" id="pivotContainer"></div>';
        var $c = $('#pivotContainer');
        $c.pivotUI(data, {
          rendererName: 'Table',
          aggregatorName: 'Count',
          vals: numericCols.length > 0 ? numericCols : allCols,
          rows: [],
          cols: [],
          renderers: $.pivotUtilities.renderers,
          hiddenAttributes: [],
          menuLimit: 200,
          exclusions: {},
          derivedAttributes: {},
        });
      } catch (ex) {
        c.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>Error: ' + escHtml(ex.message) + '</div>';
        console.error('Pivot error:', ex);
      }
    }, 100);
  }

  // Pagination via event delegation in viewContainer click handler

  // ─── Search ──────────────────────────────────────

  document.getElementById('sheetSearch').addEventListener('input', function() {
    var q = this.value.toLowerCase();
    document.querySelectorAll('.sheet-item[data-sheet]').forEach(function(el) {
      el.style.display = el.dataset.sheet.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
    });
  });

  // ─── Sidebar Toggle ──────────────────────────────

  document.getElementById('sidebarToggle').addEventListener('click', function() {
    var sidebar = document.getElementById('sidebar');
    var main = document.getElementById('mainContent');
    if (window.innerWidth <= 768) {
      sidebar.classList.toggle('show');
    } else {
      sidebar.classList.toggle('collapsed');
      main.classList.toggle('expanded');
    }
  });

  // ─── Event Listeners ────────────────────────────

  document.getElementById('namaKonsumenToggleBtn').addEventListener('click', function() {
    showNamaKonsumen = !showNamaKonsumen;
    this.classList.toggle('active');
    document.querySelectorAll('.nama-konsumen-col').forEach(function(el) {
      if (showNamaKonsumen) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });
  });

  document.getElementById('filterToggleBtn').addEventListener('click', function() {
    showFilter = !showFilter;
    var bar = document.getElementById('filterBar');
    if (showFilter) {
      buildFilterBar();
      bar.classList.add('show');
      this.classList.add('active');
    } else {
      bar.classList.remove('show');
      this.classList.remove('active');
    }
  });

  document.getElementById('pageSizeSelect').addEventListener('change', function() {
    pageSize = parseInt(this.value);
    currentPage = 1;
    renderTable();
  });

  document.getElementById('refreshBtn').addEventListener('click', function() {
    refData = {};
    initNamaKonsumen();
    loadRefData();
    if (currentSheet && activeView === 'list') loadSheetData(currentSheet);
    else if (activeView === 'pivot') renderPivot();
  });

  document.getElementById('addBtn').addEventListener('click', function() {
    if (!currentData || !currentData.headers) return;
    editingIndex = -1;
    document.getElementById('crudModalTitle').textContent = 'Tambah Baris — ' + currentSheet;
    buildForm({});
    modalInstance = new bootstrap.Modal(document.getElementById('crudModal'));
    modalInstance.show();
  });

  document.getElementById('pivotNav').addEventListener('click', function() {
    activeView = 'pivot';
    document.querySelectorAll('.sheet-item').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('pivotNav').classList.add('active');
    document.getElementById('addBtn').style.display = 'none';
    document.getElementById('filterToggleBtn').style.display = 'none';
    document.getElementById('namaKonsumenToggleBtn').style.display = 'none';
    document.getElementById('pageSizeSelect').style.display = 'none';
    document.getElementById('activeSheetBadge').textContent = 'Pivot Table';
    document.getElementById('filterBar').classList.remove('show');
    renderPivot();
  });

  document.getElementById('crudSubmitBtn').addEventListener('click', function() {
    var form = document.getElementById('crudForm');
    var inputs = form.querySelectorAll('input, select');
    var data = {};
    inputs.forEach(function(inp) { data[inp.name] = inp.value; });
    delete data['nama_konsumen'];

    var fn = editingIndex === -1 ? 'addRow' : 'updateRow';
    var params = editingIndex === -1 ? [currentSheet, sheetId, data] : [currentSheet, sheetId, editingIndex, data];

    showLoading('Menyimpan data...');
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result.success) {
          if (modalInstance) modalInstance.hide();
          toast(editingIndex === -1 ? 'Data berhasil ditambahkan' : 'Data berhasil diupdate', 'success');
          loadSheetData(currentSheet);
        } else {
          toast('Gagal: ' + result.error, 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        toast('Error: ' + err, 'error');
      })
      [fn].apply(null, params);
  });

  // Event delegation for dynamic table buttons (edit/delete/pagination)
  document.getElementById('viewContainer').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    if (btn.classList.contains('edit-row')) {
      var idx = parseInt(btn.dataset.idx);
      if (!currentData || !currentData.rows || !currentData.rows[idx]) return;
      editingIndex = idx;
      document.getElementById('crudModalTitle').textContent = 'Edit Baris #' + (idx + 1) + ' — ' + currentSheet;
      buildForm(currentData.rows[idx]);
      modalInstance = new bootstrap.Modal(document.getElementById('crudModal'));
      modalInstance.show();
      return;
    }

    if (btn.classList.contains('delete-row')) {
      var idx = parseInt(btn.dataset.idx);
      deleteTargetIdx = idx;
      document.getElementById('confirmText').textContent = 'Hapus baris #' + (idx + 1) + '? Data tidak bisa dikembalikan.';
      var modal = new bootstrap.Modal(document.getElementById('confirmModal'));
      document.getElementById('confirmDeleteBtn').onclick = function() { doDelete(deleteTargetIdx); };
      modal.show();
      return;
    }

    if (btn.id === 'prevPageBtn') {
      if (currentPage > 1) { currentPage--; renderTable(); }
      return;
    }

    if (btn.id === 'nextPageBtn') {
      var filtered = getFilteredRows();
      var total = filtered.rows.length;
      var size = pageSize === 0 ? total : pageSize;
      var totalPages = size === 0 ? 1 : Math.max(1, Math.ceil(total / size));
      if (currentPage < totalPages) { currentPage++; renderTable(); }
      return;
    }
  });

  // ─── Init ────────────────────────────────────────

  loadSheets();
</script>
</body>
</html>

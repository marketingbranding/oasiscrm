<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>OASIS sedang offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Helvetica, Arial, sans-serif;
            background: #f1efe7;
            color: #111;
        }
        * { box-sizing: border-box; }
        html, body { min-width: 0; min-height: 100%; margin: 0; overflow-x: hidden; }
        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            padding: 24px;
            background: #f1efe7;
        }
        .panel {
            width: 100%;
            max-width: 400px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 8px 8px 0 0 #000;
            padding: 24px;
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #000;
            display: grid;
            place-items: center;
        }
        .mark span {
            width: 36px;
            height: 36px;
            background: #fcc20f;
            transform: rotate(45deg);
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin: 0 0 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        button {
            min-height: 44px;
            width: 100%;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        button:hover { background: #333; }
        button:focus-visible { outline: 3px solid #fcc20f; outline-offset: 2px; }
        .note {
            margin-top: 16px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="mark" aria-hidden="true"><span></span></div>
        <h1>OASIS sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Sambungkan kembali perangkat Anda ke internet, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <p class="note">OASIS tidak menyimpan data CRM saat offline. Anda tetap dapat membuka aplikasi setelah koneksi pulih.</p>
    </div>
</body>
</html>
